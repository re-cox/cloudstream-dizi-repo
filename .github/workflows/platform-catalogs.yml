name: Refresh platform shelves
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: platform-catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install beautifulsoup4==4.14.2
      - run: python scripts/update_platform_catalogs.py
      - run: python -m unittest discover -s scripts -p test_platform_catalogs.py
      - name: Publish refreshed shelves
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add platforms
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public platform shelves [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
