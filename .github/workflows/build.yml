name: Build CloudStream Plugins

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "domains.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build plugins and generate plugins.json
        run: gradle make makePluginsJson :Dizilla:testDebugUnitTest

      - name: Collect build artifacts
        run: |
          mkdir -p dist
          cp build/plugins.json dist/plugins.json
          cp LICENSE UPSTREAM.md dist/
          find . -path "*/build/*.cs3" -exec cp {} dist/ \;
          ls -la dist

      - name: Publish to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./dist
          keep_files: false
