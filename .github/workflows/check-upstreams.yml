name: Check upstream source changes
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-source-check
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare pinned upstream commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_upstreams.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-source-report
          path: upstream-report.json
