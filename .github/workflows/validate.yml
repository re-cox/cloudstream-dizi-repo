name: Validate providers

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test domain tracking
        run: python -m unittest discover -s scripts -v
      - name: Verify generated providers are current
        run: |
          python scripts/generate_nuvio.py
          git diff --exit-code -- nuvio common/src/main/kotlin/com/dizi/DomainPolicy.kt
      - name: Test Nuvio matching, episodes and extraction
        run: node --test scripts/test_nuvio.cjs scripts/test_live_checker.cjs
