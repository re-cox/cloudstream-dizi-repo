name: Auto-Track Site Domains

on:
  schedule:
    # Check every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: domain-registry
  cancel-in-progress: false

jobs:
  update-domains:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check and update active domains
        run: python scripts/update_domains.py --report health-report.json --require-healthy

      - name: Publish site health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-health
          path: health-report.json

      - name: Validate domain changes
        run: python -m unittest discover -s scripts -v

      - name: Regenerate Nuvio fallback addresses
        run: python scripts/generate_nuvio.py

      - name: Commit updated domains and Nuvio fallbacks if changed
        run: |
          if ! git diff --quiet -- domains.json nuvio; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add domains.json nuvio
            git commit -m "chore(domains): update active site domains"
            git push
          else
            echo "No changes to commit."
          fi
