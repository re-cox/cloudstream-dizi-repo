name: Auto-Track Site Domains

on:
  schedule:
    # Check every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-domains:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check and update active domains
        run: python scripts/update_domains.py

      - name: Commit updated domains.json if changed
        run: |
          if ! git diff --quiet domains.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add domains.json
            git commit -m "chore(domains): update active site domains"
            git push
          else
            echo "No changes to commit."
          fi
